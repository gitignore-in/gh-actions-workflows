name: Reusable actionlint

on:
  workflow_call:
    inputs:
      files:
        description: >-
          Shell glob pattern(s) passed to actionlint. The value is word-split
          and glob-expanded by the shell, so multiple patterns can be separated
          by spaces. Paths containing spaces are not supported.
        required: false
        type: string
        default: ".github/workflows/*.yml"
      actionlint-version:
        description: Actionlint release version tag.
        required: false
        type: string
        default: "v1.7.12"
      shellcheck:
        description: Legacy compatibility input. Set to disabled to run actionlint with -shellcheck=.
        required: false
        type: string
        default: ""
      shellcheck-enabled:
        description: Run ShellCheck when actionlint checks shell scripts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run actionlint
        env:
          ACTIONLINT_FILES: ${{ inputs.files }}
          ACTIONLINT_SHELLCHECK: ${{ inputs.shellcheck }}
          ACTIONLINT_SHELLCHECK_ENABLED: ${{ inputs.shellcheck-enabled }}
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -eu
          set -o pipefail

          if ! printf '%s' "$ACTIONLINT_VERSION" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::actionlint-version must be an actionlint release tag like v1.7.12"
            exit 2
          fi

          actionlint_release=${ACTIONLINT_VERSION#v}
          actionlint_archive="actionlint_${actionlint_release}_linux_amd64.tar.gz"

          shellcheck_arg=()
          case "$ACTIONLINT_SHELLCHECK" in
            "")
              case "$ACTIONLINT_SHELLCHECK_ENABLED" in
                "true")
                  ;;
                "false")
                  shellcheck_arg=(-shellcheck=)
                  ;;
                *)
                  echo "::error::shellcheck-enabled must be true or false"
                  exit 2
                  ;;
              esac
              ;;
            "disabled")
              echo "::warning::shellcheck: disabled is deprecated; use shellcheck-enabled: false"
              shellcheck_arg=(-shellcheck=)
              ;;
            *)
              echo "::error::shellcheck must be empty or disabled; use shellcheck-enabled: false to disable ShellCheck"
              exit 2
              ;;
          esac

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          actionlint_url="https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/$actionlint_archive"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "$actionlint_url" -o "$tmpdir/$actionlint_archive"

          actionlint_digest=$(sha256sum "$tmpdir/$actionlint_archive" | awk '{print $1}')
          attestation_response="$tmpdir/actionlint-attestations.json"
          attestation_bundle="$tmpdir/actionlint-attestations.jsonl"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/rhysd/actionlint/attestations/sha256:$actionlint_digest" \
            -o "$attestation_response"
          if ! jq -e '.attestations | type == "array" and length > 0' \
            "$attestation_response" >/dev/null; then
            echo "::error::No public attestation was found for $actionlint_archive"
            exit 1
          fi
          jq -c '.attestations[].bundle' "$attestation_response" >"$attestation_bundle"

          # The signed bundles are fetched from the public API so callers do
          # not need to grant access to upstream attestations.
          env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$tmpdir/gh-config" \
            gh attestation verify "$tmpdir/$actionlint_archive" \
            --bundle "$attestation_bundle" \
            --repo rhysd/actionlint \
            --source-ref "refs/tags/$ACTIONLINT_VERSION" \
            --signer-workflow rhysd/actionlint/.github/workflows/release.yaml
          tar -xzf "$tmpdir/$actionlint_archive" -C "$tmpdir" actionlint

          # ACTIONLINT_FILES is intentionally unquoted so existing caller globs keep expanding.
          # shellcheck disable=SC2086
          "$tmpdir/actionlint" "${shellcheck_arg[@]}" -- $ACTIONLINT_FILES
