name: Reusable actionlint

on:
  workflow_call:
    inputs:
      files:
        description: >-
          Shell glob pattern(s) passed to actionlint. The value is word-split
          and glob-expanded by the shell, so multiple patterns can be separated
          by spaces. Paths containing spaces are not supported.
        required: false
        type: string
        default: ".github/workflows/*.yml"
      actionlint-version:
        description: Repo-approved actionlint version tag.
        required: false
        type: string
        default: "v1.7.12"
      shellcheck:
        description: Legacy compatibility input. Set to disabled to run actionlint with -shellcheck=.
        required: false
        type: string
        default: ""
      shellcheck-enabled:
        description: Run ShellCheck when actionlint checks shell scripts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run actionlint
        env:
          ACTIONLINT_FILES: ${{ inputs.files }}
          ACTIONLINT_SHELLCHECK: ${{ inputs.shellcheck }}
          ACTIONLINT_SHELLCHECK_ENABLED: ${{ inputs.shellcheck-enabled }}
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -eu
          set -o pipefail

          if ! printf '%s' "$ACTIONLINT_VERSION" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::actionlint-version must be an actionlint release tag like v1.7.12"
            exit 2
          fi

          actionlint_archive=
          actionlint_sha256=
          case "$ACTIONLINT_VERSION" in
            "v1.7.12")
              actionlint_archive="actionlint_1.7.12_linux_amd64.tar.gz"
              actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            *)
              echo "::error::actionlint-version must be a repo-approved version. Supported versions: v1.7.12"
              exit 2
              ;;
          esac

          shellcheck_arg=()
          case "$ACTIONLINT_SHELLCHECK" in
            "")
              case "$ACTIONLINT_SHELLCHECK_ENABLED" in
                "true")
                  ;;
                "false")
                  shellcheck_arg=(-shellcheck=)
                  ;;
                *)
                  echo "::error::shellcheck-enabled must be true or false"
                  exit 2
                  ;;
              esac
              ;;
            "disabled")
              echo "::warning::shellcheck: disabled is deprecated; use shellcheck-enabled: false"
              shellcheck_arg=(-shellcheck=)
              ;;
            *)
              echo "::error::shellcheck must be empty or disabled; use shellcheck-enabled: false to disable ShellCheck"
              exit 2
              ;;
          esac

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          actionlint_url="https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/$actionlint_archive"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "$actionlint_url" -o "$tmpdir/$actionlint_archive"
          printf '%s  %s\n' "$actionlint_sha256" "$tmpdir/$actionlint_archive" | sha256sum --check --status
          tar -xzf "$tmpdir/$actionlint_archive" -C "$tmpdir" actionlint

          # ACTIONLINT_FILES is intentionally unquoted so existing caller globs keep expanding.
          # shellcheck disable=SC2086
          "$tmpdir/actionlint" "${shellcheck_arg[@]}" -- $ACTIONLINT_FILES
